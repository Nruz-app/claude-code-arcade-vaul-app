<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Arcade Vault — Cruceta MK-II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  La mitad izquierda del GAMEPAD MK-II: solo la cruceta.

  Sale de `gamepad.html`, que sigue ahí y documenta el mando entero. Se parte en
  dos (SPEC 17) porque en la app las dos mitades dejan de compartir marco: la
  cruceta va a un costado de la pantalla y los botones al otro, dentro de un
  chasis único que hace de consola.

  Por eso el marco de esta página es un panel al tamaño de la cruceta y no la
  barra de 760 px del original: aquí solo sirve para poder abrir el archivo y
  ver la pieza suelta. En la app, el marco lo pone el chasis.
-->
<style>
:root {
  --bg: #0a0a0f;
  --ink: #e6e9ff;
  --ink-dim: #8a8fb5;
  --cyan: #00f5ff;
  --line: rgba(0, 245, 255, 0.18);
  --mono: "JetBrains Mono", "Courier New", monospace;

  /* La geometría de la SPEC 16: 50 px de botón y 3 px de hueco dan los 156 px
     de cruceta del original. Con el dedo suben a 56, que es el mínimo que fijó
     la SPEC 14. */
  --dir: 50px;
  --hueco: 3px;
  --flecha: 22px;
}
@media (pointer: coarse) {
  :root { --dir: 56px; --flecha: 24px; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); }

.page {
  min-height: 100vh;
  padding: 48px 24px 64px;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(120% 80% at 50% 100%, rgba(0, 245, 255, 0.10), transparent 60%),
    var(--bg);
}

/* Panel: el mismo material que el chasis, al tamaño de la pieza. */
.gp {
  position: relative;
  padding: 24px;
  background: linear-gradient(180deg, #1c1c28 0%, #0c0c14 100%);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow:
    0 30px 80px -30px rgba(0, 245, 255, 0.4),
    0 0 0 1px rgba(255, 255, 255, 0.02),
    inset 0 1px 0 rgba(255, 255, 255, 0.06),
    inset 0 -2px 0 rgba(0, 0, 0, 0.6);
}
.gp::before {
  content: ""; position: absolute; inset: 4px;
  border: 1px solid rgba(0, 245, 255, 0.14);
  border-radius: 18px; pointer-events: none;
}
.gp::after {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 8px 8px;
  border-radius: inherit; pointer-events: none; opacity: 0.6;
}

/* Rejilla 3×3 de filas y columnas FIJAS. Que sean fijas y no `auto` es lo que
   permite que un juego no dibuje una dirección sin que la cruz cambie de
   tamaño: ROCAS no usa «abajo» y su hueco se queda reservado. */
.gp-dpad {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: repeat(3, var(--dir));
  grid-template-rows: repeat(3, var(--dir));
  gap: var(--hueco);
}
.dp {
  width: var(--dir); height: var(--dir);
  background: linear-gradient(180deg, #1a1a25, #0a0a12);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  color: var(--ink-dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0;
  box-shadow:
    0 4px 0 #050507,
    inset 0 1px 0 rgba(255, 255, 255, 0.06),
    inset 0 -2px 4px rgba(0, 0, 0, 0.6);
  transition: transform 80ms, box-shadow 140ms, color 140ms, border-color 140ms, background 140ms;
}
.dp .dp-arrow { width: var(--flecha); height: var(--flecha); transition: filter 140ms; }

/* El :hover va guardado: en táctil, uno sin guardia se queda pegado en el
   último botón tocado hasta que se toca otro. */
@media (hover: hover) {
  .dp:hover { color: var(--cyan); border-color: rgba(0, 245, 255, 0.35); }
}

/* `.on` es el eco del teclado físico y comparte declaración con :active:
   tocar el botón y pulsar su tecla son la misma cosa vista desde el juego. */
.dp.on, .dp:active {
  transform: translateY(3px);
  color: var(--cyan);
  background: linear-gradient(180deg, #08161e, #030a0e);
  border-color: var(--cyan);
  box-shadow:
    0 1px 0 #050507,
    inset 0 0 16px rgba(0, 245, 255, 0.45),
    0 0 16px rgba(0, 245, 255, 0.5);
}
.dp.on .dp-arrow, .dp:active .dp-arrow {
  filter: drop-shadow(0 0 6px var(--cyan)) drop-shadow(0 0 12px var(--cyan));
}
.dp-up    { grid-area: 1 / 2; }
.dp-left  { grid-area: 2 / 1; }
.dp-right { grid-area: 2 / 3; }
.dp-down  { grid-area: 3 / 2; }

.dp-hub {
  grid-area: 2 / 2;
  width: var(--dir); height: var(--dir);
  background: radial-gradient(circle at 50% 50%, #181822 0%, #08080d 80%);
  border: 1px solid rgba(0, 245, 255, 0.15);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  pointer-events: none;
}
.dp-hub-gem {
  width: 12px; height: 12px;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan), inset 0 0 4px rgba(0, 0, 0, 0.5);
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  animation: pulse-led 2s ease-in-out infinite;
}
@keyframes pulse-led { 50% { opacity: 0.35; transform: scale(0.85); } }
</style>
</head>
<body>
<div class="page">
  <div class="gp" role="group" aria-label="Cruceta">
    <div class="gp-dpad" aria-label="D-pad">
      <button class="dp dp-up"    aria-label="up"    data-key="up"><svg class="dp-arrow" viewBox="0 0 24 24"><path d="M12 4 L20 16 L4 16 Z" fill="currentColor"/></svg></button>
      <button class="dp dp-right" aria-label="right" data-key="right"><svg class="dp-arrow" viewBox="0 0 24 24"><path d="M8 4 L20 12 L8 20 Z" fill="currentColor"/></svg></button>
      <button class="dp dp-down"  aria-label="down"  data-key="down"><svg class="dp-arrow" viewBox="0 0 24 24"><path d="M4 8 L20 8 L12 20 Z" fill="currentColor"/></svg></button>
      <button class="dp dp-left"  aria-label="left"  data-key="left"><svg class="dp-arrow" viewBox="0 0 24 24"><path d="M16 4 L16 20 L4 12 Z" fill="currentColor"/></svg></button>
      <div class="dp-hub" aria-hidden="true"><span class="dp-hub-gem"></span></div>
    </div>
  </div>
</div>

<script>
(function () {
  var keyMap = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right"
  };
  function btn(key) { return document.querySelector('[data-key="' + key + '"]'); }
  document.addEventListener("keydown", function (e) {
    // `e.repeat` fuera: el auto-repeat del sistema dispara treinta keydown por
    // segundo mientras se mantiene una tecla.
    var k = keyMap[e.key]; if (!k || e.repeat) return;
    var el = btn(k); if (el) el.classList.add("on");
  });
  document.addEventListener("keyup", function (e) {
    var k = keyMap[e.key]; if (!k) return;
    var el = btn(k); if (el) el.classList.remove("on");
  });
  document.querySelectorAll("[data-key]").forEach(function (b) {
    b.addEventListener("pointerdown", function (e) {
      // Sin captura, deslizar el dedo fuera del botón entrega el pointerup a
      // otro elemento y la tecla se queda pulsada para siempre.
      try { b.setPointerCapture(e.pointerId); } catch (err) {}
      b.classList.add("on");
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
      b.addEventListener(ev, function () { b.classList.remove("on"); });
    });
  });
})();
</script>
</body>
</html>
